name: Generate 40-entry editorial pilot
on:
  push:
    branches: [main]
    paths:
      - 'research/select_editorial_pilot.py'
      - 'research/PILOT_40_PANDUAN.md'
      - '.github/workflows/editorial-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare review-only pilot from public existing entries
        run: |
          mkdir -p editorial-pilot
          python research/select_editorial_pilot.py --out editorial-pilot/PILOT_40_ENTRI.tsv
          cp research/PILOT_40_PANDUAN.md editorial-pilot/PANDUAN.md
      - name: Check sample size, preserved IDs and not-yet-reviewed status
        run: |
          python - <<'PY'
          import csv
          with open('editorial-pilot/PILOT_40_ENTRI.tsv',encoding='utf-8-sig',newline='') as f:
            rows=list(csv.DictReader(f,delimiter='\t'))
          assert len(rows)==40,len(rows)
          assert len({r['entry_id'] for r in rows})==40
          assert all(r['status_keputusan']=='BELUM DITELAAH' for r in rows)
          assert all(r['sumber_id'] and r['kata_mandailing'] for r in rows)
          assert len({r['kata_mandailing'][:1].upper() for r in rows})>=15
          print('Editorial pilot QA: PASS (40 pending-review entries, IDs intact)')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Mandailing-Pilot-40-Telaah-Editor
          path: editorial-pilot/*
          retention-days: 30
